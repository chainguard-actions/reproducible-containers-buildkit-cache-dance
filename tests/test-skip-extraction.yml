name: Test skip-extraction flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-skip || true
          docker buildx inspect --bootstrap

      - name: Prepare cache source directory
        run: |
          mkdir -p /tmp/skip-test-cache
          echo "some-cached-data" > /tmp/skip-test-cache/data.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-map: '{ "/tmp/skip-test-cache": "/root/.cache/skip-test" }'
          scratch-dir: /tmp/dance-scratch-skip
          skip-extraction: "true"
          save-always: "false"

      - name: Assert action ran with skip-extraction=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip-extraction=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in limited Docker environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
