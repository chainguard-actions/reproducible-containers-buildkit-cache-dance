name: Test cache-map input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Create cache directory
        run: |
          mkdir -p /tmp/test-cache
          echo "test cache content" > /tmp/test-cache/test.txt

      - name: Run action with cache-map input
        id: action
        uses: .
        with:
          cache-map: |
            {
              "/tmp/test-cache": "/root/.cache/test"
            }
          skip-extraction: "true"
          scratch-dir: /tmp/scratch-cache-map

      - name: Verify action completed
        run: |
          echo "Action completed successfully with cache-map input"
          echo "PASS"
