name: Test multi-entry cache-map
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-multi || true
          docker buildx inspect --bootstrap

      - name: Prepare multiple cache source directories
        run: |
          mkdir -p /tmp/multi-cache-go
          echo "go-build-data" > /tmp/multi-cache-go/go.txt
          mkdir -p /tmp/multi-cache-npm
          echo "npm-data" > /tmp/multi-cache-npm/npm.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-map: |
            {
              "/tmp/multi-cache-go": "/root/.cache/go-build",
              "/tmp/multi-cache-npm": "/root/.npm"
            }
          scratch-dir: /tmp/dance-scratch-multi
          skip-extraction: "true"

      - name: Assert action ran with multi-entry cache-map
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multi-entry cache-map"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in limited Docker environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
