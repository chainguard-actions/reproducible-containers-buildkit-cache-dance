name: Test Dockerfile auto-discovery mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile with cache mounts for auto-discovery
        run: |
          cat > /tmp/Dockerfile-test <<'EOF'
          FROM alpine:3.18
          RUN --mount=type=cache,target=/root/.cache/test \
              echo "building with cache"
          EOF

      - id: action
        uses: .
        with:
          dockerfile: /tmp/Dockerfile-test
          cache-dir: /tmp/cache-dir-autodiscovery
          scratch-dir: /tmp/scratch-autodiscovery
          skip-extraction: "true"
        continue-on-error: true

      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
