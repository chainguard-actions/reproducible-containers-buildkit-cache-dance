name: Test legacy cache-source and cache-target inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare legacy cache source directory
        run: |
          mkdir -p /tmp/legacy-cache
          echo "legacy-cached-content" > /tmp/legacy-cache/data.txt

      - id: action
        uses: .
        with:
          cache-source: /tmp/legacy-cache
          cache-target: /root/.cache/go-build
          scratch-dir: /tmp/scratch-legacy
          skip-extraction: "true"
        continue-on-error: true

      - name: Assert action ran without unexpected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
