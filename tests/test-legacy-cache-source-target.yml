name: Test legacy cache-source and cache-target inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Create legacy cache source directory
        run: |
          mkdir -p /tmp/legacy-cache
          echo "legacy cache content" > /tmp/legacy-cache/data.txt

      - name: Run action with legacy cache-source and cache-target inputs
        id: action
        uses: .
        with:
          cache-source: /tmp/legacy-cache
          cache-target: /root/.cache/go-build
          skip-extraction: "true"
          scratch-dir: /tmp/scratch-legacy

      - name: Verify action completed
        run: |
          echo "Action completed successfully with legacy cache-source and cache-target inputs"
          echo "PASS"
