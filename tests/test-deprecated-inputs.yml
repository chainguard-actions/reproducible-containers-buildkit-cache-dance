name: Test deprecated cache-source and cache-target inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-deprecated || true
          docker buildx inspect --bootstrap

      - name: Prepare cache source directory
        run: |
          mkdir -p /tmp/deprecated-cache
          echo "go-build-cache-data" > /tmp/deprecated-cache/pkg.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-source: /tmp/deprecated-cache
          cache-target: /root/.cache/go-build
          scratch-dir: /tmp/dance-scratch-deprecated
          skip-extraction: "true"

      - name: Assert action ran with deprecated inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should emit a deprecation warning and still run
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with deprecated cache-source/cache-target inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in limited Docker environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
